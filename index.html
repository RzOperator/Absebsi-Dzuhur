<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Absen Dzuhur">
<title>Absensi Dzuhur</title>
<style>
:root{
  --bg:#f2f6f3; --surface:#ffffff; --text:#12261f; --muted:#5a6e65; --border:#d8e2dc;
  --accent:#0f6b55; --accent-ink:#ffffff; --sun:#b9801a; --sun-bg:#fbf0d8;
  --ok:#0f6b55; --ok-bg:#dff1e8; --warn:#8a5a00; --warn-bg:#fdefc8;
  --err:#b3261e; --err-bg:#fbe4e1; --soft:#e8f0eb;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1612; --surface:#15221c; --text:#e6f0ea; --muted:#91a89c; --border:#24352c;
    --accent:#3fb890; --accent-ink:#04150f; --sun:#e0b04f; --sun-bg:#3a2e12;
    --ok:#5fd0a6; --ok-bg:#133326; --warn:#f0c45e; --warn-bg:#3b2f10;
    --err:#ff958c; --err-bg:#3d1c1a; --soft:#1c2c24;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45}
h3{font-size:17px;margin:20px 0 10px;font-weight:700}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.hidden{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .t{font-size:19px;font-weight:700;letter-spacing:.2px}
.top .d{font-size:13px;opacity:.85}
.sync{border:0;background:rgba(255,255,255,.2);background:color-mix(in srgb,var(--accent-ink) 16%,transparent);color:inherit;font:inherit;font-size:12px;border-radius:16px;padding:6px 11px;max-width:55%;text-align:right;cursor:pointer}

main{padding:14px 14px calc(92px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;color:var(--muted);padding:9px 2px 8px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);font-weight:700}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3:first-child{margin-top:0}
label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}
input,select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0;transform:scale(1.25)}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;margin-top:0}
.row.between{justify-content:space-between}
.row.between>*{flex:0 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--err)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}
.btn.block{display:flex;width:100%;margin-bottom:12px}
.btn:disabled{opacity:.45}

.banner{background:var(--sun-bg);border-color:transparent}
.banner .big{font-size:28px;font-weight:800;line-height:1.15;color:var(--sun)}
.banner .day{font-size:15px;font-weight:600}

.cam{position:relative;border-radius:14px;overflow:hidden;background:#0a1410;margin-bottom:12px;min-height:150px}
.cam .ph{display:flex;align-items:center;justify-content:center;height:190px;color:#9db3a8;font-size:14px}
#reader{width:100%}
#reader video{border-radius:14px}

.result{border-radius:14px;padding:14px 16px;margin-bottom:12px;border-left:6px solid}
.result .n{font-size:22px;font-weight:800;line-height:1.2}
.result .m{font-size:15px;margin-top:2px}
.result.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.result.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.result.err{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.note{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:var(--err-bg);color:var(--err)}
.note.warn{background:var(--warn-bg);color:var(--warn)}

details.card summary{cursor:pointer;font-weight:600}
details.card .row{margin-top:10px}
details.day{border-top:1px solid var(--border);padding:10px 0}
details.day:first-of-type{border-top:0}
details.day summary{cursor:pointer}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:14px;font-weight:600;border-radius:20px;padding:7px 13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left;font:inherit;color:var(--text)}
button.item{cursor:pointer}
.item .who{flex:1;min-width:0}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:6px}
.badge{font-size:13px;font-weight:700;border-radius:20px;padding:4px 10px;white-space:nowrap}
.badge.y{background:var(--ok-bg);color:var(--ok)}
.badge.n{background:var(--soft);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;border:1px dashed var(--border);border-radius:12px;margin-bottom:8px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text)}
.summary{font-size:15px;margin:4px 0 12px}
.summary b{font-size:22px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 6px;border-bottom:1px solid var(--border);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));text-align:center}
.sheet label{text-align:left}
#qrBox{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin:8px 0 12px;line-height:0}
#qrBox img{display:block}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:24px;font-size:14px;z-index:30;max-width:88%;text-align:center}

#printArea{display:none}
@media print{
  body{background:#fff}
  .top,main,.tabs,.modal,.toast{display:none!important}
  #printArea{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pcard{border:1px dashed #888;padding:10px;text-align:center;break-inside:avoid;color:#000;background:#fff;line-height:1.3}
  .pcard img,.pcard canvas{margin:0 auto}
  .pn{font-weight:700;font-size:13px;margin-top:6px}
  .pm{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div><div class="t">Absensi Dzuhur</div><div class="d" id="hdrDate"></div></div>
  <button class="sync" id="syncSt" onclick="syncTap()"></button>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-t="scan" onclick="go('scan')"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>Scan</button>
  <button data-t="reg" onclick="go('reg')"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Registrasi</button>
  <button data-t="rekap" onclick="go('rekap')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rekap</button>
  <button data-t="set" onclick="go('set')"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Pengaturan</button>
</nav>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="printArea"></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ============ Util & penyimpanan ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const pad = n => String(n).padStart(2,'0');
const dateStr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const timeStr = d => pad(d.getHours())+':'+pad(d.getMinutes());
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const prettyDate = ds => { const [y,m,d] = ds.split('-').map(Number); const dt = new Date(y,m-1,d); return DAYS[dt.getDay()]+', '+d+'/'+m+'/'+y; };
const keyOf = s => String(s).toLowerCase().replace(/\s+/g,'');
const cleanName = s => String(s).trim().replace(/\s+/g,' ');
function autoGroup(name){
  const n = cleanName(name), m = n.match(/^(\d+|[IVX]+(?=\s|$))/i);
  return m ? m[1].toUpperCase() : n;
}

const P = 'absensi_dzuhur_';
const store = {mem:{}, ok:false};
try { localStorage.setItem(P+'t','1'); localStorage.removeItem(P+'t'); store.ok = true; } catch(e) {}
function load(k, def){
  try { if(store.ok){ const v = localStorage.getItem(P+k); if(v !== null) return JSON.parse(v); } } catch(e) {}
  return store.mem[k] !== undefined ? store.mem[k] : def;
}
function save(k, v){
  store.mem[k] = v;
  if(store.ok){ try { localStorage.setItem(P+k, JSON.stringify(v)); } catch(e) {} }
}

const defaultCfg = {
  start:'12:00', end:'14:00', limit:true, sep:';',
  classes:['1','2','3','4','5','6'].map(n => ({name:n, group:n})),
  schedule:{0:[],1:['6'],2:['6'],3:['5'],4:['4'],5:[],6:[]}
};
/* Rapikan pengaturan: ubah format lama (kelas berupa angka) ke format baru (nama kelas, jadwal berupa daftar) */
function normCfg(c, students){
  c = c || {};
  const out = Object.assign({}, defaultCfg, c);
  let cl = Array.isArray(c.classes)
    ? c.classes.map(x => typeof x === 'string' ? {name:cleanName(x), group:autoGroup(x)} : {name:cleanName(x.name), group:cleanName(x.group || autoGroup(x.name))})
    : defaultCfg.classes.map(x => Object.assign({}, x));
  (students || []).forEach(s => { if(s.kelas && !cl.some(x => x.name === s.kelas)) cl.push({name:s.kelas, group:autoGroup(s.kelas)}); });
  out.classes = cl;
  const sch = {};
  for(let d = 0; d < 7; d++){
    let v = c.schedule ? c.schedule[d] : undefined;
    if(v === undefined) v = defaultCfg.schedule[d];
    if(Array.isArray(v)) v = v.map(String);
    else if(+v) v = [String(v)];
    else if(typeof v === 'string' && v && v !== '0') v = [v];
    else v = [];
    sch[d] = v.filter(n => cl.some(x => x.name === n));
  }
  out.schedule = sch;
  return out;
}

const state = {
  students: load('students', []).map(s => Object.assign({}, s, {kelas:String(s.kelas)})),
  att: load('att', []),
  cfg: null
};
state.cfg = normCfg(load('cfg', {}), state.students);
const persist = () => { save('students', state.students); save('att', state.att); save('cfg', state.cfg); };

/* ---- Pembantu kelas ---- */
const classNames = () => state.cfg.classes.map(c => c.name);
const findClass = n => state.cfg.classes.find(c => keyOf(c.name) === keyOf(n));
const cidx = n => { const i = classNames().indexOf(n); return i < 0 ? 999 : i; };
const todayClasses = () => state.cfg.schedule[new Date().getDay()] || [];
const byCode = c => state.students.find(s => s.code === c);
const byName = (a,b) => a.name.localeCompare(b.name,'id');
const byKelasNama = (a,b) => cidx(a.kelas) - cidx(b.kelas) || byName(a,b);
function groupsOf(){
  const out = [];
  state.cfg.classes.forEach(c => {
    let o = out.find(x => x.g === c.group);
    if(!o){ o = {g:c.group, names:[]}; out.push(o); }
    o.names.push(c.name);
  });
  return out;
}
/* Pilihan cakupan: all | g:<kelompok> | c:<kelas> */
function scopeOptions(sel){
  const gs = groupsOf().filter(x => x.names.length > 1);
  return '<option value="all"'+(sel === 'all' ? ' selected' : '')+'>Semua kelas</option>'
    + (gs.length ? '<optgroup label="Kelompok">'+gs.map(x => '<option value="g:'+esc(x.g)+'"'+(sel === 'g:'+x.g ? ' selected' : '')+'>Kelompok '+esc(x.g)+' ('+x.names.map(esc).join(', ')+')</option>').join('')+'</optgroup>' : '')
    + '<optgroup label="Per kelas">'+state.cfg.classes.map(c => '<option value="c:'+esc(c.name)+'"'+(sel === 'c:'+c.name ? ' selected' : '')+'>Kelas '+esc(c.name)+'</option>').join('')+'</optgroup>';
}
function scopeClasses(sel){
  if(!sel || sel === 'all') return classNames();
  if(sel.startsWith('g:')) return state.cfg.classes.filter(c => c.group === sel.slice(2)).map(c => c.name);
  return [sel.slice(2)].filter(n => classNames().includes(n));
}
const kelasOpts = sel => classNames().map(n => '<option value="'+esc(n)+'"'+(n === sel ? ' selected' : '')+'>Kelas '+esc(n)+'</option>').join('');

const genCode = () => {
  const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out;
  do {
    const r = new Uint8Array(8); crypto.getRandomValues(r);
    out = Array.from(r, x => ch[x % ch.length]).join('');
  } while(byCode(out));
  return out;
};

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 2600);
}
function openModal(html){ $('sheet').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); $('sheet').innerHTML = ''; }
function download(name, data, mime){
  const blob = new Blob([data], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function toCsv(rows){
  const sep = state.cfg.sep;
  const f = v => { v = String(v); return (v.includes(sep) || v.includes('"') || v.includes('\n')) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return '\uFEFF' + rows.map(r => r.map(f).join(sep)).join('\r\n');
}

/* ============ Sinkron Google Sheet ============ */
const sync = {url:load('sync_url',''), token:load('sync_token',''), outbox:load('outbox',[]), ver:-1, busy:false, st:'off', err:''};
const enabled = () => !!(sync.url && sync.token);
const oid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const cfgSync = () => ({start:state.cfg.start, end:state.cfg.end, limit:state.cfg.limit, schedule:state.cfg.schedule, classes:state.cfg.classes});
const stuOp = s => ({t:'stu', s:{code:s.code, nis:s.nis, name:s.name, kelas:s.kelas}});

function queue(op){
  if(!enabled()) return;
  op.id = oid(); sync.outbox.push(op); save('outbox', sync.outbox);
  setStatus(); scheduleSync();
}
function queueCfg(){
  if(!enabled()) return;
  sync.outbox = sync.outbox.filter(o => o.t !== 'cfg');
  queue({t:'cfg', cfg:cfgSync()});
}
function cfgChanged(){ persist(); queueCfg(); }
function fullOps(){
  return [{t:'cfg', cfg:cfgSync()}, ...state.students.map(stuOp),
    ...state.att.map(a => ({t:'att', a:{date:a.date, code:a.code, time:a.time || '', manual:!!a.manual}}))]
    .map(o => Object.assign(o, {id:oid()}));
}

let syncTimer;
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(() => doSync(), 1200); }
function syncTap(){ if(!enabled()) go('set'); else doSync(); }
function setStatus(s){
  if(s) sync.st = s;
  const b = $('syncSt'); if(!b) return;
  const n = sync.outbox.length, q = n ? ' ('+n+' menunggu)' : '';
  b.textContent = {off:'Belum terhubung', syncing:'Menyinkronkan...', ok:'Tersinkron'+q, offline:'Offline'+q, err:'Gagal sinkron'+q}[enabled() ? sync.st : 'off'];
  b.title = sync.err || '';
}

async function callServer(ops, ver, url = sync.url, token = sync.token){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 30000);
  try{
    const r = await fetch(url, {method:'POST', body:JSON.stringify({token, ops, ver}), signal:ctl.signal});
    const txt = await r.text();
    try{ return JSON.parse(txt); }
    catch(e){ throw new Error('Respons server tidak valid. Pastikan akses Web App diatur ke Anyone dan alamatnya berakhiran /exec.'); }
  } catch(e){
    if(e instanceof TypeError) throw new Error('Tidak bisa menjangkau server. Periksa internet dan alamat Web App.');
    throw e;
  } finally { clearTimeout(tm); }
}

async function doSync(){
  if(!enabled() || sync.busy) return;
  if(!navigator.onLine){ setStatus('offline'); return; }
  sync.busy = true; setStatus('syncing');
  const sent = sync.outbox.slice();
  try{
    const res = await callServer(sent, sync.ver);
    if(!res.ok) throw new Error(res.error || 'Server menolak permintaan');
    applyServer(res, new Set(sent.map(o => o.id)));
    sync.err = ''; setStatus('ok');
  } catch(e){
    sync.err = e.name === 'AbortError' ? 'Waktu habis' : String(e.message || e);
    setStatus(navigator.onLine ? 'err' : 'offline');
  } finally {
    sync.busy = false;
    if(sync.st === 'ok' && sync.outbox.length) scheduleSync();
  }
}

function applyServer(res, sentIds){
  sync.ver = res.ver;
  if(res.same) return;
  const before = JSON.stringify([state.students, state.att, state.cfg]);
  const remaining = sync.outbox.filter(o => !sentIds.has(o.id));
  state.students = res.students.map(s => ({code:s.code, nis:s.nis, name:s.name, kelas:String(s.kelas)}));
  state.att = res.att.map(a => ({date:a.date, code:a.code, time:a.time || '', manual:!!a.manual}));
  state.cfg = normCfg(res.cfg ? Object.assign({}, state.cfg, res.cfg) : state.cfg, state.students);
  remaining.forEach(applyLocal);
  sync.outbox = remaining; save('outbox', remaining);
  persist();
  if(JSON.stringify([state.students, state.att, state.cfg]) !== before) refreshViews();
}
function applyLocal(op){
  if(op.t === 'stu'){
    const s = Object.assign({}, op.s, {kelas:String(op.s.kelas)});
    const i = state.students.findIndex(x => x.code === s.code);
    if(i >= 0) state.students[i] = s; else state.students.push(s);
  }
  else if(op.t === 'stuDel'){ state.students = state.students.filter(s => s.code !== op.code); state.att = state.att.filter(a => a.code !== op.code); }
  else if(op.t === 'att'){ if(!state.att.some(a => a.date === op.a.date && a.code === op.a.code)) state.att.push(Object.assign({}, op.a)); }
  else if(op.t === 'attDel'){ state.att = state.att.filter(a => !(a.date === op.date && a.code === op.code)); }
  else if(op.t === 'cfg'){ state.cfg = normCfg(Object.assign({}, state.cfg, op.cfg), state.students); }
  else if(op.t === 'clearAtt'){ state.att = []; }
  else if(op.t === 'clearAll'){ state.students = []; state.att = []; }
}

async function connectSheet(){
  const url = $('syUrl').value.trim(), tok = $('syTok').value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) || !tok){ toast('Isi alamat Web App dan kode akses'); return; }
  if(enabled() && url === sync.url && tok === sync.token){ doSync(); toast('Sinkronisasi dijalankan'); return; }
  toast('Menghubungkan...');
  try{
    const res = await callServer([], -1, url, tok);
    if(!res.ok) throw new Error(res.error || 'Gagal');
    const serverEmpty = !res.students.length && !res.att.length;
    const hasLocal = state.students.length || state.att.length;
    if(!serverEmpty && state.students.length &&
       !confirm('Google Sheet sudah berisi '+res.students.length+' siswa. Data di perangkat ini ('+state.students.length+' siswa) akan DIGANTI dengan data dari Google Sheet. Lanjutkan?')) return;
    sync.url = url; sync.token = tok; save('sync_url', url); save('sync_token', tok);
    sync.ver = -1; sync.outbox = []; sync.err = '';
    if(serverEmpty){ if(hasLocal || !res.cfg) sync.outbox = fullOps(); }
    else {
      applyServer(res, new Set());
      if(!res.cfg) sync.outbox = [{t:'cfg', cfg:cfgSync(), id:oid()}];
    }
    save('outbox', sync.outbox);
    setStatus('syncing'); vSet(); toast('Terhubung ke Google Sheet'); doSync();
  } catch(e){ toast('Gagal: '+(e.message || e)); }
}
function disconnectSheet(){
  if(!confirm('Putuskan dari Google Sheet? Data di perangkat ini tetap ada, tapi tidak lagi sinkron.')) return;
  sync.url = ''; sync.token = ''; sync.outbox = []; sync.ver = -1;
  save('sync_url', ''); save('sync_token', ''); save('outbox', []);
  setStatus('off'); vSet(); toast('Terputus dari Google Sheet');
}
function syncCard(){

    <p class="muted">${on ? 'Terhubung. Data siswa, absen, kelas, dan jadwal otomatis sama di semua perangkat.' : 'Hubungkan semua HP dan laptop ke satu Google Sheet agar datanya sama.'}</p>

async function toggleCam(){ camOn ? await stopCam() : await startCam(); }
async function startCam(){
  if(typeof Html5Qrcode === 'undefined'){ showResult('err','Pemindai belum termuat','Periksa koneksi internet, lalu muat ulang halaman.'); return; }
  try{
    qr = new Html5Qrcode('reader');
    await qr.start({facingMode:'environment'}, {fps:10, qrbox:(w,h) => { const s = Math.floor(Math.min(w,h)*0.75); return {width:s, height:s}; }}, onScan, () => {});
    camOn = true; $('ph').style.display = 'none'; $('camBtn').textContent = 'Hentikan scan';
  } catch(e){
    qr = null; camOn = false;
    showResult('err','Kamera tidak bisa dibuka','Izinkan akses kamera di browser. Halaman harus dibuka lewat alamat HTTPS, bukan lewat file langsung.');
  }
}
async function stopCam(){
  const q = qr; qr = null; camOn = false;
  if(q){ try { await q.stop(); q.clear(); } catch(e) {} }
  const p = $('ph'); if(p) p.style.display = '';
  const b = $('camBtn'); if(b) b.textContent = 'Mulai scan';
}
function onScan(text){
  const n = Date.now();
  if(text === last.c && n - last.t < 3000) return;
  last = {c:text, t:n};
  const code = text.trim().replace(/^SHL:/,'');
  attempt(byCode(code), true);
}
function manual(){
  const v = ($('man').value || '').trim(); if(!v) return;
  const s = state.students.find(x => x.nis === v);
  attempt(s, false); $('man').value = '';
}

function attempt(s, fromQr){
  if(!s) return showResult('err','Tidak dikenal', fromQr ? 'QR ini belum terdaftar di aplikasi.' : 'NIS tidak ditemukan.');
  const now = new Date(), ks = todayClasses();
  if(!ks.length) return showResult('err', s.name, 'Tidak ada jadwal absen hari ini.');
  if(!ks.includes(s.kelas)) return showResult('err', s.name, 'Bukan jadwal kelasmu hari ini. Giliran hari ini: kelas '+ks.join(', ')+'.');
  if(state.cfg.limit){
    const m = now.getHours()*60 + now.getMinutes();
    if(m < toMin(state.cfg.start) || m > toMin(state.cfg.end)) return showResult('err', s.name, 'Di luar jam absen ('+state.cfg.start+' sampai '+state.cfg.end+').');
  }
  const d = dateStr(now);
  const ex = state.att.find(a => a.date === d && a.code === s.code);
  if(ex) return showResult('warn', s.name, 'Sudah absen'+(ex.time ? ' pukul '+ex.time : '')+'.');
  const tm = timeStr(now);
  state.att.push({date:d, code:s.code, time:tm});
  persist();
  queue({t:'att', a:{date:d, code:s.code, time:tm}});
  showResult('ok', s.name, 'Hadir, Kelas '+s.kelas+' pukul '+tm);
  refreshScan();
}
function showResult(type, name, msg){
  const r = $('result'); if(!r) return;
  r.innerHTML = `<div class="result ${type}" role="status"><div class="n">${esc(name)}</div><div class="m">${esc(msg)}</div></div>`;
  beep(type === 'ok');
  if(navigator.vibrate) navigator.vibrate(type === 'ok' ? 80 : [60,40,60]);
}
function beep(ok){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    o.frequency.value = ok ? 880 : 220; g.gain.value = 0.08;
    o.start(); o.stop(audio.currentTime + (ok ? 0.12 : 0.3));
  } catch(e) {}
}

function saveStudent(e){
  e.preventDefault();
  const nis = $('fNis').value.trim(), name = cleanName($('fNama').value), kelas = $('fKelas').value;
  if(!nis || !name || !kelas) return;
  const dup = state.students.find(s => s.nis === nis && s.code !== editing);
  if(dup){ toast('NIS sudah dipakai oleh '+dup.name); return; }
  if(editing){
    const s = byCode(editing); s.nis = nis; s.name = name; s.kelas = kelas;
    editing = null; persist(); queue(stuOp(s)); vReg(); toast('Perubahan disimpan');
  } else {
    const s = {code:genCode(), nis, name, kelas};
    state.students.push(s); lastKelas = kelas; persist(); queue(stuOp(s)); vReg(); showQR(s.code);
  }
}
function startEdit(c){ editing = c; vReg(); window.scrollTo(0,0); }
function cancelEdit(){ editing = null; vReg(); }
function delStudent(c){
  const s = byCode(c); if(!s) return;
  if(!confirm('Hapus '+s.name+'? Riwayat absennya juga ikut terhapus.')) return;
  state.students = state.students.filter(x => x.code !== c);
  state.att = state.att.filter(a => a.code !== c);
  persist(); queue({t:'stuDel', code:c}); vReg(); toast('Siswa dihapus');
}
function importCsv(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let add = 0, skip = 0, newCls = 0;
    String(r.result).replace(/^\uFEFF/,'').split(/\r?\n/).forEach((line, i) => {
      if(!line.trim()) return;
      const p = line.split(/[;,\t]/).map(x => x.trim().replace(/^"|"$/g,''));
      if(i === 0 && (/^(nis|nisn|no\.?)$/i.test(p[0]) || /^kelas$/i.test(p[2] || ''))) return; /* baris judul */
      const kraw = cleanName(p[2] || '');
      if(p.length < 3 || !p[0] || !p[1] || !kraw){ skip++; return; }
      if(state.students.some(s => s.nis === p[0])){ skip++; return; }
      let cls = findClass(kraw);
      if(!cls){ cls = {name:kraw, group:autoGroup(kraw)}; state.cfg.classes.push(cls); newCls++; }
      const ns = {code:genCode(), nis:p[0], name:cleanName(p[1]), kelas:cls.name};
      state.students.push(ns); queue(stuOp(ns)); add++;
    });
    if(newCls) queueCfg();
    persist(); vReg();
    toast(add+' siswa diimpor'+(newCls ? ', '+newCls+' kelas baru' : '')+(skip ? ', '+skip+' dilewati' : ''));
  };
  r.readAsText(f);
}
function showQR(c){
  const s = byCode(c); if(!s) return;
  openModal(`
    <div style="font-size:20px;font-weight:800">${esc(s.name)}</div>
    <div class="muted">Kelas ${esc(s.kelas)}, NIS ${esc(s.nis)}</div>
    <div id="qrBox"></div>
    <div class="row"><button class="btn primary" onclick="dlQR('${s.code}')">Unduh gambar</button><button class="btn" onclick="closeModal()">Tutup</button></div>`);
  if(typeof QRCode === 'undefined'){ $('qrBox').outerHTML = '<div class="note">Pembuat QR belum termuat. Periksa koneksi internet.</div>'; return; }
  new QRCode($('qrBox'), {text:'SHL:'+s.code, width:220, height:220, correctLevel:QRCode.CorrectLevel.M});
}
function dlQR(c){
  const s = byCode(c); if(!s || typeof QRCode === 'undefined') return;
  const t = document.createElement('div');
  new QRCode(t, {text:'SHL:'+s.code, width:260, height:260, correctLevel:QRCode.CorrectLevel.M});
  const q = t.querySelector('canvas'); if(!q) return;
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 400;
  const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0,0,320,400);
  x.drawImage(q, 30, 20, 260, 260);
  x.fillStyle = '#000'; x.textAlign = 'center';
  x.font = 'bold 22px sans-serif'; x.fillText(s.name, 160, 315, 300);
  x.font = '18px sans-serif'; x.fillText('Kelas '+s.kelas+', NIS '+s.nis, 160, 345, 300);
  x.font = '14px sans-serif'; x.fillStyle = '#555'; x.fillText('Absensi Dzuhur', 160, 380);
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'QR_Kelas'+s.kelas.replace(/[^A-Za-z0-9]+/g,'')+'_'+s.name.replace(/[^A-Za-z0-9]+/g,'_')+'.png';
  document.body.appendChild(a); a.click(); a.remove();
}
function printQR(){
  if(typeof QRCode === 'undefined'){ toast('Pembuat QR belum termuat'); return; }
  const fc = scopeClasses(filt);
  const list = state.students.filter(s => fc.includes(s.kelas)).sort(byKelasNama);
  const pa = $('printArea'); pa.innerHTML = '';

    const c = document.createElement('div'); c.className = 'pcard';
    const q = document.createElement('div'); c.appendChild(q);

}

/* ============ Rekap ============ */
const rk = {sel:'', mode:'day', date:dateStr(new Date()), month:dateStr(new Date()).slice(0,7)};

function defaultSel(){
  const ks = todayClasses();
  if(ks.length === 1) return 'c:'+ks[0];
  if(ks.length > 1){
    const gs = new Set(ks.map(k => (findClass(k) || {}).group));
    if(gs.size === 1) return 'g:'+[...gs][0];
  }
  return 'all';
}
function schedDates(kelas, month){
  const [y,m] = month.split('-').map(Number), n = new Date(y,m,0).getDate(), today = dateStr(new Date()), out = [];
  for(let d = 1; d <= n; d++){
    const dt = new Date(y, m-1, d), ds = dateStr(dt);
    if(ds > today) break;
    if((state.cfg.schedule[dt.getDay()] || []).includes(kelas)) out.push(ds);
  }
  return out;
}
function vRekap(){
  if(!rk.sel || !scopeClasses(rk.sel).length) rk.sel = defaultSel();
  const names = scopeClasses(rk.sel);
  const day = rk.mode === 'day';
  let body = '', nStud = 0;
  const rec = new Map(state.att.filter(a => a.date === rk.date).map(a => [a.code, a]));
  const dow = new Date(rk.date+'T00:00:00').getDay();
  names.forEach(k => {
    const sts = state.students.filter(s => s.kelas === k).sort(byName);
    nStud += sts.length;
    if(day){
      const h = sts.filter(s => rec.has(s.code)).length;
      body += `<h3>Kelas ${esc(k)} <span class="muted" style="font-weight:400">(${h} dari ${sts.length} hadir)</span></h3>`
        + ((state.cfg.schedule[dow] || []).includes(k) ? '' : `<div class="note warn">Tanggal ini bukan hari jadwal kelas ${esc(k)}.</div>`)
        + (sts.length ? sts.map(s => { const a = rec.get(s.code); return `<button class="item" onclick="toggleManual('${s.code}')"><div class="who"><div class="nm">${esc(s.name)}</div><div class="sub">NIS ${esc(s.nis)}</div></div><span class="badge ${a ? 'y' : 'n'}">${a ? (a.time || 'Manual') : 'Belum'}</span></button>`; }).join('') : '<div class="empty">Belum ada siswa di kelas ini.</div>');
    } else {
      const dates = schedDates(k, rk.month), total = dates.length;
      body += `<h3>Kelas ${esc(k)} <span class="muted" style="font-weight:400">(${total} hari jadwal sejauh ini)</span></h3>`
        + (sts.length ? `<table><tr><th>Nama</th><th class="r">Hadir</th><th class="r">Persen</th></tr>`
          + sts.map(s => { const cnt = state.att.filter(a => a.code === s.code && a.date.startsWith(rk.month)).length; return `<tr><td>${esc(s.name)}</td><td class="r">${cnt}/${total}</td><td class="r">${total ? Math.min(100, Math.round(cnt/total*100)) : 0}%</td></tr>`; }).join('')
          + '</table>' : '<div class="empty">Belum ada siswa di kelas ini.</div>');
    }
  });
  $('view').innerHTML = `
    <div class="seg"><button class="${day ? 'on' : ''}" onclick="rk.mode='day';vRekap()">Harian</button><button class="${!day ? 'on' : ''}" onclick="rk.mode='month';vRekap()">Bulanan</button></div>
    <div class="row" style="margin-bottom:12px">
      <select onchange="rk.sel=this.value;vRekap()">${scopeOptions(rk.sel)}</select>
      ${day ? `<input type="date" value="${rk.date}" onchange="if(this.value){rk.date=this.value;vRekap()}">` : `<input type="month" value="${rk.month}" onchange="if(this.value){rk.month=this.value;vRekap()}">`}
    </div>
    <div class="summary"><b>${names.length}</b> kelas, ${nStud} siswa. Ekspor Excel membuat satu sheet untuk setiap kelas.</div>
    ${body}
    <button class="btn block" style="margin-top:12px" onclick="exportRekap()" ${nStud ? '' : 'disabled'}>Ekspor ke Excel (.xlsx)</button>`;
}
function toggleManual(c){
  const s = byCode(c); if(!s) return;
  const i = state.att.findIndex(a => a.date === rk.date && a.code === c);
  if(i >= 0){
    if(!confirm('Batalkan absen '+s.name+' pada '+prettyDate(rk.date)+'?')) return;
    state.att.splice(i,1);
    queue({t:'attDel', date:rk.date, code:c});
  } else {
    if(!confirm('Tandai '+s.name+' hadir pada '+prettyDate(rk.date)+'?')) return;
    state.att.push({date:rk.date, code:c, time:'', manual:true});
    queue({t:'att', a:{date:rk.date, code:c, time:'', manual:true}});
  }
  persist(); vRekap();
}

/* ---- Ekspor Excel: satu sheet per kelas ---- */
function scopeLabel(){
  const l = rk.sel === 'all' ? 'SemuaKelas' : rk.sel.startsWith('g:') ? 'Kelompok'+rk.sel.slice(2) : 'Kelas'+rk.sel.slice(2);
  return l.replace(/[^A-Za-z0-9]+/g,'_');
}
function addClassSheet(wb, k, used){
  const GREEN = 'FF0F6B55', LINE = {style:'thin', color:{argb:'FFB8C7BF'}};
  const BORDER = {top:LINE, left:LINE, bottom:LINE, right:LINE};
  const day = rk.mode === 'day';
  const sts = state.students.filter(s => s.kelas === k).sort(byName);
  if(!sts.length) return false;
  const base = (String(k).replace(/[\[\]:*?\/\\]/g,'-').slice(0,28) || 'Kelas');
  let nm = base, n = 2;
  while(used.has(nm.toLowerCase())) nm = base+'_'+(n++);
  used.add(nm.toLowerCase());
  const ws = wb.addWorksheet(nm, {pageSetup:{orientation: day ? 'portrait' : 'landscape', paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0}});
  const dates = day ? [] : schedDates(k, rk.month);
  const ncols = day ? 5 : 4 + dates.length + 3;
  ws.columns = (day ? [6,32,16,12,10] : [6,32,16,...dates.map(() => 6), 8, 11, 10]).map(w => ({width:w}));
  const head = (r, text, size) => {
    ws.mergeCells(r, 1, r, ncols);
    const c = ws.getCell(r, 1);
    c.value = text; c.font = {bold:true, size}; c.alignment = {horizontal:'center', vertical:'middle'};
  };
  head(1, 'Absensi Sholat Dzuhur', 16);
  head(2, day ? 'Kelas '+k+', '+prettyDate(rk.date) : 'Kelas '+k+', bulan '+rk.month.slice(5)+'/'+rk.month.slice(0,4), 12);
  ws.getRow(1).height = 26;
  const HR = 4, hrow = ws.getRow(HR);
  hrow.values = day ? ['No','Nama','NIS','Status','Jam'] : ['No','Nama','NIS', ...dates.map(d => d.slice(8)+'/'+d.slice(5,7)), 'Hadir','Total hari','Persen'];
  hrow.height = 24;
  hrow.eachCell(c => {
    c.font = {bold:true, color:{argb:'FFFFFFFF'}};
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:GREEN}};
    c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    c.border = BORDER;
  });
  const rec = new Map(state.att.filter(a => a.date === rk.date).map(a => [a.code, a]));
  let r = HR + 1, hadirDay = 0;
  sts.forEach((s, i) => {
    const row = ws.getRow(r++);
    if(day){
      const a = rec.get(s.code); if(a) hadirDay++;
      row.values = [i+1, s.name, String(s.nis), a ? 'Hadir' : 'Belum', a ? (a.time || 'Manual') : ''];
    } else {
      const mine = new Set(state.att.filter(a => a.code === s.code).map(a => a.date));
      const cnt = state.att.filter(a => a.code === s.code && a.date.startsWith(rk.month)).length;
      row.values = [i+1, s.name, String(s.nis), ...dates.map(d => mine.has(d) ? 'H' : '-'), cnt, dates.length, dates.length ? Math.min(1, cnt/dates.length) : 0];
    }
    row.height = 20;
    row.eachCell({includeEmpty:true}, (c, col) => {
      if(col > ncols) return;
      c.border = BORDER;
      c.alignment = {horizontal: col === 2 ? 'left' : 'center', vertical:'middle'};
      if(day && col === 4){
        const ok = c.value === 'Hadir';
        c.font = {bold:true, color:{argb: ok ? 'FF0F6B55' : 'FF8A8A8A'}};
        c.fill = {type:'pattern', pattern:'solid', fgColor:{argb: ok ? 'FFDFF1E8' : 'FFF1F1F1'}};
      }
      if(!day && col > 3 && col <= 3 + dates.length){
        const ok = c.value === 'H';
        c.font = {bold:ok, color:{argb: ok ? 'FF0F6B55' : 'FF9A9A9A'}};
        if(ok) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFDFF1E8'}};
      }
      if(!day && col === ncols) c.numFmt = '0%';
    });
  });
  if(day){
    r++;
    ws.mergeCells(r, 1, r, ncols);
    const c = ws.getCell(r, 1);
    c.value = 'Hadir '+hadirDay+' dari '+sts.length+' siswa';
    c.font = {bold:true}; c.alignment = {horizontal:'left'};
  }
  ws.views = [{state:'frozen', xSplit:2, ySplit:HR}];
  return true;
}
async function exportRekap(){
  if(typeof ExcelJS === 'undefined'){ toast('Pustaka Excel belum termuat, mengunduh CSV'); return exportCsv(); }
  const wb = new ExcelJS.Workbook(), used = new Set();
  let made = 0;
  scopeClasses(rk.sel).forEach(k => { if(addClassSheet(wb, k, used)) made++; });
  if(!made){ toast('Belum ada siswa untuk diekspor'); return; }
  const name = (rk.mode === 'day' ? 'Absen_Dzuhur_'+scopeLabel()+'_'+rk.date : 'Rekap_Dzuhur_'+scopeLabel()+'_'+rk.month)+'.xlsx';
  try{
    const buf = await wb.xlsx.writeBuffer();
    download(name, buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  } catch(e){ toast('Gagal membuat file Excel, mengunduh CSV'); exportCsv(); }
}
function exportCsv(){
  const rows = [], day = rk.mode === 'day';
  const rec = new Map(state.att.filter(a => a.date === rk.date).map(a => [a.code, a]));
  rows.push(day ? ['No','Kelas','Nama','NIS','Status','Jam'] : ['No','Kelas','Nama','NIS','Hadir','Total hari','Persen']);
  let i = 1;
  scopeClasses(rk.sel).forEach(k => {
    const total = day ? 0 : schedDates(k, rk.month).length;
    state.students.filter(s => s.kelas === k).sort(byName).forEach(s => {
      if(day){ const a = rec.get(s.code); rows.push([i++, k, s.name, s.nis, a ? 'Hadir' : 'Belum', a ? (a.time || 'Manual') : '']); }
      else { const cnt = state.att.filter(a => a.code === s.code && a.date.startsWith(rk.month)).length; rows.push([i++, k, s.name, s.nis, cnt, total, (total ? Math.min(100, Math.round(cnt/total*100)) : 0)+'%']); }
    });
  });
  download((day ? 'Absen_Dzuhur_'+scopeLabel()+'_'+rk.date : 'Rekap_Dzuhur_'+scopeLabel()+'_'+rk.month)+'.csv', toCsv(rows), 'text/csv;charset=utf-8');
}

/* ============ Pengaturan: kelas ============ */
function classCard(){
  const cl = state.cfg.classes;
  const cnt = k => state.students.filter(s => s.kelas === k).length;
  return `<div class="card"><h3>Daftar kelas</h3>
    <p class="muted">Atur nama kelas sesuai sekolahmu, misalnya 6A, VII A, atau X IPA 1. Kelas dengan kelompok yang sama bisa direkap bersama.</p>
    ${cl.length ? cl.map((c,i) => `<div class="item"><div class="who"><div class="nm">${esc(c.name)}</div><div class="sub">Kelompok ${esc(c.group)}, ${cnt(c.name)} siswa</div></div><div class="acts"><button class="btn sm" onclick="editClass(${i})">Ubah</button><button class="btn sm danger" onclick="delClass(${i})">Hapus</button></div></div>`).join('') : '<div class="empty">Belum ada kelas.</div>'}
    <div class="row" style="margin:12px 0 8px"><input id="nkName" placeholder="Nama kelas, mis. 6A" autocomplete="off"><input id="nkGroup" placeholder="Kelompok (opsional)" autocomplete="off"></div>
    <button class="btn block" onclick="addClass()">Tambah kelas</button>
    <details class="card"><summary>Tambah banyak kelas sekaligus</summary>
      <label style="margin-top:10px">Tingkat<input id="bkT" placeholder="mis. 1, 7, atau X" autocomplete="off"></label>
      <label>Rombel (huruf atau nomor)<input id="bkR" placeholder="mis. A,B,C atau A-F atau 1-4" autocomplete="off"></label>
      <button class="btn block" style="margin:0" onclick="addBulk()">Buat kelas</button>
      <p class="muted" style="margin:8px 0 0">Contoh: tingkat 1 dan rombel A-C membuat 1A, 1B, 1C.</p>
    </details>
    <div class="muted" style="margin:4px 0 8px">Tambah cepat per jenjang:</div>
    <div class="chips"><button class="chip" onclick="preset('SD')">SD (1-6)</button><button class="chip" onclick="preset('SMP')">SMP (7-9)</button><button class="chip" onclick="preset('SMA')">SMA (10-12)</button></div>
  </div>`;
}
function addClassObj(name, group){
  name = cleanName(name); if(!name) return false;
  if(findClass(name)) return false;
  state.cfg.classes.push({name, group:cleanName(group || '') || autoGroup(name)});
  return true;
}
function addClass(){
  const name = cleanName($('nkName').value);
  if(!name){ toast('Isi nama kelas'); return; }
  if(!addClassObj(name, $('nkGroup').value)){ toast('Kelas '+name+' sudah ada'); return; }
  cfgChanged(); vSet(); toast('Kelas '+name+' ditambahkan');
}
function parseRombel(r){
  const out = [];
  String(r).split(/[,;\s]+/).filter(Boolean).forEach(t => {
    let m = t.match(/^([A-Za-z])\s*-\s*([A-Za-z])$/);
    if(m){ let a = m[1].toUpperCase().charCodeAt(0), b = m[2].toUpperCase().charCodeAt(0); if(a > b) [a,b] = [b,a]; for(let c = a; c <= b; c++) out.push(String.fromCharCode(c)); return; }
    m = t.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){ let a = +m[1], b = +m[2]; if(a > b) [a,b] = [b,a]; if(b - a > 60) b = a + 60; for(let c = a; c <= b; c++) out.push(String(c)); return; }
    out.push(t.toUpperCase());
  });
  return out;
}
function addBulk(){
  const T = cleanName($('bkT').value), R = $('bkR').value;
  if(!T){ toast('Isi tingkat kelas'); return; }
  const parts = parseRombel(R), sep = /^\d+$/.test(T) ? '' : ' ';
  const names = parts.length ? parts.map(p => T+sep+p) : [T];
  let n = 0;
  names.forEach(nm => { if(addClassObj(nm, T)) n++; });
  if(!n){ toast('Semua kelas itu sudah ada'); return; }
  cfgChanged(); vSet(); toast(n+' kelas ditambahkan');
}
function preset(kind){
  const r = {SD:[1,6], SMP:[7,9], SMA:[10,12]}[kind];
  let n = 0;
  for(let i = r[0]; i <= r[1]; i++) if(addClassObj(String(i), String(i))) n++;
  if(!n){ toast('Kelas jenjang itu sudah ada'); return; }
  cfgChanged(); vSet(); toast(n+' kelas ditambahkan');
}
function editClass(i){
  const c = state.cfg.classes[i]; if(!c) return;
  openModal(`<div style="font-size:18px;font-weight:800;margin-bottom:10px">Ubah kelas</div>
    <label>Nama kelas<input id="ecName" value="${esc(c.name)}" autocomplete="off"></label>
    <label>Kelompok<input id="ecGroup" value="${esc(c.group)}" autocomplete="off"></label>
    <div class="row"><button class="btn primary" onclick="saveClass(${i})">Simpan</button><button class="btn" onclick="closeModal()">Batal</button></div>`);
}
function saveClass(i){
  const c = state.cfg.classes[i]; if(!c) return;
  const name = cleanName($('ecName').value), group = cleanName($('ecGroup').value) || autoGroup(name);
  if(!name){ toast('Nama kelas wajib diisi'); return; }
  if(state.cfg.classes.some((x,j) => j !== i && keyOf(x.name) === keyOf(name))){ toast('Nama kelas sudah dipakai'); return; }
  const old = c.name;
  if(name !== old){
    state.students.forEach(s => { if(s.kelas === old){ s.kelas = name; queue(stuOp(s)); } });
    Object.keys(state.cfg.schedule).forEach(d => { state.cfg.schedule[d] = state.cfg.schedule[d].map(n => n === old ? name : n); });
    if(lastKelas === old) lastKelas = name;
    if(filt === 'c:'+old) filt = 'c:'+name;
    if(rk.sel === 'c:'+old) rk.sel = 'c:'+name;
  }
  c.name = name; c.group = group;
  cfgChanged(); closeModal(); vSet(); toast('Kelas diperbarui');
}
function delClass(i){
  const c = state.cfg.classes[i]; if(!c) return;
  const n = state.students.filter(s => s.kelas === c.name).length;
  if(n){ toast('Kelas '+c.name+' masih berisi '+n+' siswa. Pindahkan atau hapus siswanya dulu.'); return; }
  if(!confirm('Hapus kelas '+c.name+'?')) return;
  state.cfg.classes.splice(i,1);
  Object.keys(state.cfg.schedule).forEach(d => { state.cfg.schedule[d] = state.cfg.schedule[d].filter(x => x !== c.name); });
  cfgChanged(); vSet(); toast('Kelas dihapus');
}

/* ============ Pengaturan: jadwal ============ */
const daySum = d => { const s = state.cfg.schedule[d] || []; return s.length ? 'Kelas '+s.join(', ') : 'Tidak ada absen'; };
function dayBody(d){
  const sel = state.cfg.schedule[d] || [];
  const gs = groupsOf().filter(x => x.names.length > 1);
  return (gs.length ? `<div class="muted" style="margin:6px 0 4px;font-size:13px">Pilih satu kelompok sekaligus</div><div class="chips">${gs.map((x,gi) => `<button class="chip ${x.names.every(n => sel.includes(n)) ? 'on' : ''}" onclick="toggleGroup(${d},${gi})">Semua ${esc(x.g)}</button>`).join('')}</div>` : '')
    + `<div class="muted" style="margin:10px 0 4px;font-size:13px">Atau pilih kelas satu per satu</div>
    <div class="chips">${state.cfg.classes.map((c,i) => `<button class="chip ${sel.includes(c.name) ? 'on' : ''}" onclick="toggleSched(${d},${i})">${esc(c.name)}</button>`).join('') || '<span class="muted">Tambahkan kelas dulu.</span>'}</div>`;
}
function refreshDay(d){ $('db'+d).innerHTML = dayBody(d); $('ds'+d).textContent = daySum(d); }
function setDay(d, arr){ state.cfg.schedule[d] = classNames().filter(n => arr.includes(n)); cfgChanged(); refreshDay(d); }
function toggleSched(d, i){
  const n = state.cfg.classes[i].name, cur = state.cfg.schedule[d] || [];
  setDay(d, cur.includes(n) ? cur.filter(x => x !== n) : cur.concat(n));
}
function toggleGroup(d, gi){
  const g = groupsOf().filter(x => x.names.length > 1)[gi]; if(!g) return;
  const cur = state.cfg.schedule[d] || [];
  setDay(d, g.names.every(n => cur.includes(n)) ? cur.filter(x => !g.names.includes(x)) : cur.concat(g.names));
}
function schedCard(){
  return `<div class="card"><h3>Jadwal kelas</h3><p class="muted">Satu hari boleh diisi beberapa kelas sekaligus. Ketuk nama hari untuk mengatur.</p>
    ${[1,2,3,4,5,6,0].map(d => `<details class="day"><summary><b>${DAYS[d]}</b> <span class="muted" id="ds${d}">${esc(daySum(d))}</span></summary><div id="db${d}">${dayBody(d)}</div></details>`).join('')}</div>`;
}

/* ============ Pengaturan ============ */
function vSet(){
  const c = state.cfg;
  $('view').innerHTML = `
    ${syncCard()}
    ${classCard()}
    ${schedCard()}
    <div class="card"><h3>Jam absen Dzuhur</h3>
      <label style="font-weight:400"><input type="checkbox" ${c.limit ? 'checked' : ''} onchange="state.cfg.limit=this.checked;cfgChanged()">Batasi absen hanya pada jam ini</label>
      <div class="row"><label>Mulai<input type="time" value="${c.start}" onchange="state.cfg.start=this.value||'12:00';cfgChanged()"></label>
      <label>Selesai<input type="time" value="${c.end}" onchange="state.cfg.end=this.value||'14:00';cfgChanged()"></label></div>
    </div>
    <div class="card"><h3>Cadangan data</h3>
      <p class="muted">Data tersimpan di browser perangkat ini. Unduh cadangan secara berkala.</p>
      <button class="btn block" onclick="backup()">Unduh cadangan (JSON)</button>
      <label style="margin:0">Pulihkan dari cadangan<input type="file" accept=".json,application/json" onchange="restore(this)"></label>
    </div>
    <div class="card"><h3>Hapus data</h3>
      <button class="btn block danger" onclick="clearAtt()">Hapus semua riwayat absen</button>
      <button class="btn block danger" style="margin:0" onclick="clearAll()">Hapus semua data (siswa dan absen)</button>
    </div>`;
}
function backup(){ download('cadangan-absensi-dzuhur-'+dateStr(new Date())+'.json', JSON.stringify({v:2, students:state.students, att:state.att, cfg:state.cfg}), 'application/json'); }
function restore(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.students) || !Array.isArray(d.att)) throw 0;
      if(!confirm('Data saat ini akan diganti dengan isi cadangan ('+d.students.length+' siswa). Lanjutkan?')) return;
      state.students = d.students.map(s => Object.assign({}, s, {kelas:String(s.kelas)}));
      state.att = d.att;
      state.cfg = normCfg(d.cfg || state.cfg, state.students);
      persist();
      if(enabled()){ sync.outbox = [{t:'clearAll', id:oid()}, ...fullOps()]; save('outbox', sync.outbox); setStatus(); scheduleSync(); }
      vSet(); toast('Data dipulihkan');
    } catch(e){ toast('File cadangan tidak valid'); }
  };
  r.readAsText(f);
}
function clearAtt(){ if(confirm('Hapus semua riwayat absen? Data siswa tetap ada.'+(enabled() ? ' Riwayat di Google Sheet juga akan terhapus.' : ''))){ state.att = []; persist(); queue({t:'clearAtt'}); toast('Riwayat absen dihapus'); } }
function clearAll(){ if(confirm('Hapus SEMUA data siswa dan absen? Tindakan ini tidak bisa dibatalkan.'+(enabled() ? ' Data di Google Sheet dan semua perangkat lain juga akan terhapus.' : ''))){ state.students = []; state.att = []; persist(); queue({t:'clearAll'}); toast('Semua data dihapus'); } }

/* ============ Mulai ============ */
document.addEventListener('visibilitychange', () => { if(!document.hidden){ hdr(); if(tab === 'scan') refreshScan(); doSync(); } });
window.addEventListener('online', () => doSync());
window.addEventListener('offline', () => setStatus('offline'));
setInterval(() => { if(!document.hidden) doSync(); }, 30000);
hdr(); sync.st = enabled() ? 'syncing' : 'off'; setStatus(); go('scan'); doSync();
</script>
